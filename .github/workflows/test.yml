name: アプリとデータの検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 公開中のアプリは 3.14。Community Cloud で選べる版のうち、依存パッケージが動く版を並べる
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依存パッケージを導入
        run: pip install -r requirements.txt pytest
      - name: データを検査（壊れたCSVならここで止まる）
        run: python scripts/build.py
      - name: アプリを起動して検査
        run: pytest -q tests
